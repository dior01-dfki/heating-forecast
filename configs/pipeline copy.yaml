Models:
  DartsTFTModel: 
    input_chunk_length: 7
    output_chunk_length: 5
    hidden_size: 32
    dropout: 0.1            
    lstm_layers: 2          
    batch_size: 32          
    n_epochs: 1           
    random_state: 42
    quantiles: [0.1, 0.5, 0.9]
    num_samples: 100
  DartsTCNModel:
    input_chunk_length: 7
    output_chunk_length: 5
    kernel_size: 3
    num_filters: 32
    dilation_base: 2
    num_layers: 3
    dropout: 0.1
    weight_norm: true
    n_epochs: 5
    batch_size: 8
    lr: 0.001
    random_state: null
    likelihood: QuantileRegression
    quantiles: [0.1, 0.5, 0.9]

DataSources: 
  BaltBestAggregatedAPIData:
    roles:
      TARGET: q_hca
      KNOWN: temperature_outdoor_avg
      OBSERVED: ['temperature_1_max', 'temperature_2_max','temperature_room_avg']

DataProvider:
    splits: [0.33, 0.66]

Metrics:
  DimwiseAggregatedQuantileLoss:
    axes: [OFFSET]
  DimwiseAggregatedMetric:
    axes: [TIME_STEP]

ClearML:
  task:
    project_name: ForeSightNEXT/BaltBest
    task_name: Forcateri Pipeline Test
    repo: git@github.com:dior01-dfki/heating-forecast.git
    branch: main
    docker: dior00002/heating-forecast2:v1
    script: main.py
    skip_env_install: 0
  